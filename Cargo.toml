[package]
name = "toltrim"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Trim command output for coding agents, and count the tokens saved"
license = "Apache-2.0"

[lib]
name = "toltrim"
path = "src/lib.rs"

[[bin]]
name = "toltrim"
path = "src/main.rs"

[dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
