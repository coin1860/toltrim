[package]
name = "toltrim"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Trim command output for coding agents, and count the tokens saved"
license = "Apache-2.0"

[lib]
name = "toltrim"
path = "src/lib.rs"

[[bin]]
name = "toltrim"
path = "src/main.rs"

[dependencies]
# Gain Records live in SQLite (ADR-0006). `bundled` compiles the SQLite
# amalgamation, so there is no system SQLite to find and no network to reach.
rusqlite = { version = "0.32.1", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
